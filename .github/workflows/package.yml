name: Package plugin

# Bundles the plugin files a user needs to copy into their Gramps plugins
# folder (see README.md's "Installation") into one GrampsIllnessPlugin.zip,
# so they don't have to pick individual files out of the repository
# themselves.
#
# - Push to main: (re)publishes a single, rolling "latest" GitHub Release
#   with the current build - always the same release entry, just updated in
#   place, so the Releases page doesn't fill up with one entry per commit.
# - Push of a "v*" tag (e.g. v0.4.0): publishes a proper, permanent,
#   versioned release.
# - Can also be run manually (Actions tab > Package plugin > Run workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Gramps and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gramps gettext zip

      - name: Run tests (don't publish a broken build)
        run: python3 -m unittest discover -s test -p "test_*.py" -v

      - name: Build GrampsIllnessPlugin.zip
        run: |
          mkdir -p dist/GrampsIllnessPlugin
          cp illness_filter.py illness_filter_rule.py illness_filter_rule.gpr.py \
             illness_graphml.py illness_graphml.gpr.py dist/GrampsIllnessPlugin/
          cp -r locale dist/GrampsIllnessPlugin/
          (cd dist && zip -r GrampsIllnessPlugin.zip GrampsIllnessPlugin)

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/GrampsIllnessPlugin.zip \
            --title "Latest build" \
            --notes "Automatically built from the latest commit on main ($(git rev-parse --short HEAD)). For a stable version, use a tagged release instead, if one exists." \
            --prerelease

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/GrampsIllnessPlugin.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
